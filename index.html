<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Ranjeet ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;background:#05030b}
#scene{position:relative;width:100%;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 55%,rgba(125,20,85,.3),transparent 32%),radial-gradient(circle at 20% 20%,rgba(65,30,130,.18),transparent 30%),linear-gradient(180deg,#05030b,#100618 55%,#05030b)}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:white;box-shadow:0 0 8px white;opacity:.3;animation:twinkle 2s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.5)}to{opacity:1;transform:scale(1.6)}}
.intro{position:absolute;top:8%;width:100%;text-align:center;color:rgba(255,255,255,.75);letter-spacing:3px;font:14px Arial,sans-serif;transition:opacity .8s}
.intro.hide{opacity:0}
.heart-area{position:absolute;left:50%;top:50%;width:220px;height:220px;transform:translate(-50%,-50%);transition:transform 1s ease,opacity .8s}
.heart-area.hit{animation:heartHit .75s ease forwards}
.heart{position:absolute;width:125px;height:125px;left:48px;top:48px;background:linear-gradient(135deg,#ffd1eb,#ff68b4 22%,#f01883 55%,#97003f);transform:rotate(-45deg);border-radius:17px;filter:drop-shadow(0 0 10px #ff3fa0) drop-shadow(0 0 30px #ff168c) drop-shadow(0 0 65px rgba(255,20,140,.5));animation:heartBeat 1.6s ease-in-out infinite}
.heart:before,.heart:after{content:"";position:absolute;width:125px;height:125px;border-radius:50%;background:inherit}
.heart:before{top:-62px;left:0}.heart:after{left:62px;top:0}
.shine{position:absolute;width:25px;height:48px;left:72px;top:58px;background:rgba(255,255,255,.65);border-radius:50%;transform:rotate(-45deg);filter:blur(2px);z-index:5}
@keyframes heartBeat{0%,100%{transform:rotate(-45deg) scale(1)}50%{transform:rotate(-45deg) scale(1.06)}}
@keyframes heartHit{0%{transform:translate(-50%,-50%) scale(1)}25%{transform:translate(-50%,-50%) scale(1.2)}45%{transform:translate(-50%,-50%) scale(.9)}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
.arrow-button{position:absolute;left:12%;top:52%;width:150px;height:70px;border:0;background:transparent;cursor:pointer;z-index:20;transform:rotate(-7deg);transition:transform .25s ease}
.arrow-button:hover{transform:rotate(-7deg) scale(1.08)}
.arrow-button:active{transform:rotate(-7deg) scale(.95)}
.arrow{position:absolute;left:0;top:31px;width:135px;height:5px;border-radius:10px;background:linear-gradient(90deg,#fff,#d9d9d9);box-shadow:0 0 5px white,0 0 12px rgba(255,255,255,.6)}
.arrow:after{content:"";position:absolute;right:-20px;top:-9px;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:23px solid #e9e9e9;filter:drop-shadow(0 0 4px white)}
.arrow:before{content:"";position:absolute;left:-5px;top:-15px;width:24px;height:30px;border-left:4px solid #ff4fa8;border-top:3px solid #ff4fa8;transform:skewY(-25deg)}
.click-text{position:absolute;left:50%;top:62px;transform:translateX(-50%);white-space:nowrap;color:rgba(255,255,255,.8);font:12px Arial,sans-serif;letter-spacing:1px;animation:clickPulse 1.5s infinite}
@keyframes clickPulse{0%,100%{opacity:.45}50%{opacity:1}}
.arrow-button.flying{animation:shootArrow 1.45s cubic-bezier(.55,.05,.15,1) forwards;pointer-events:none}
.arrow-button.flying .click-text{display:none}
@keyframes shootArrow{0%{left:12%;top:52%;transform:rotate(-7deg)}35%{left:30%;top:43%;transform:rotate(-13deg)}65%{left:49%;top:48%;transform:rotate(2deg)}100%{left:54%;top:50%;transform:rotate(0deg)}}
.impact{position:absolute;left:50%;top:50%;width:30px;height:30px;border-radius:50%;border:3px solid white;box-shadow:0 0 15px white,0 0 35px #ff2693,0 0 70px #ff2693;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none}
.impact.show{animation:impactRing 1s ease-out forwards}
@keyframes impactRing{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(9)}}
.message{position:absolute;left:50%;top:14%;width:100%;text-align:center;opacity:0;transform:translate(-50%,-20px) scale(.7);pointer-events:none}
.message.show{animation:messageReveal 1.8s cubic-bezier(.2,.8,.2,1) forwards}
.message h1{font-size:clamp(42px,10vw,92px);font-weight:normal;color:white;text-shadow:0 0 8px white,0 0 20px #ff8bca,0 0 45px #ff238f,0 0 80px #ff238f}
.message .name{display:block;margin-top:8px;font:700 clamp(25px,6vw,55px) Arial,sans-serif;color:#ffb9df;letter-spacing:5px;text-shadow:0 0 15px #ff238f,0 0 35px #ff238f}
.message .subtitle{margin-top:15px;font:clamp(13px,3vw,20px) Arial,sans-serif;color:rgba(255,255,255,.85);letter-spacing:4px}
@keyframes messageReveal{0%{opacity:0;transform:translate(-50%,40px) scale(.65)}60%{opacity:1;transform:translate(-50%,-5px) scale(1.05)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
.particle{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;opacity:0;pointer-events:none;box-shadow:0 0 10px currentColor}
.particle.explode{animation:particleExplosion 1.8s cubic-bezier(.1,.7,.2,1) forwards}
@keyframes particleExplosion{0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) translate(var(--x),var(--y)) rotate(600deg) scale(0)}}
.firework{position:absolute;width:5px;height:5px;border-radius:50%;opacity:0;box-shadow:0 0 8px white,0 0 18px #ff48a6}
.firework.go{animation:firework .9s ease-out forwards}
@keyframes firework{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--fx),var(--fy)) scale(0)}}
.float-heart{position:absolute;bottom:-40px;color:#ff5eae;opacity:0;filter:drop-shadow(0 0 8px #ff238f);pointer-events:none}
.float-heart.go{animation:floatHeart var(--duration) linear forwards}
@keyframes floatHeart{0%{opacity:0;transform:translateY(0) scale(.4) rotate(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-110vh) scale(1.2) rotate(360deg)}}
.confetti{position:absolute;top:-20px;width:7px;height:14px;opacity:0;pointer-events:none}
.confetti.go{animation:confettiFall var(--duration) linear forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(110vh) rotate(720deg)}}
.replay{position:absolute;left:50%;bottom:30px;transform:translateX(-50%) scale(0);opacity:0;padding:12px 25px;border:1px solid rgba(255,255,255,.25);border-radius:30px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);color:white;cursor:pointer;font:14px Arial,sans-serif}
.replay.show{animation:replayShow .7s ease forwards 2s}
@keyframes replayShow{to{opacity:1;transform:translateX(-50%) scale(1)}}
@media(max-width:600px){
.arrow-button{left:4%;transform:scale(.8) rotate(-7deg)}
.heart-area{transform:translate(-50%,-50%) scale(.8)}
.intro{font-size:11px}
@keyframes shootArrow{0%{left:4%;top:52%;transform:scale(.8) rotate(-7deg)}35%{left:25%;top:43%;transform:scale(.8) rotate(-13deg)}65%{left:47%;top:48%;transform:scale(.8) rotate(2deg)}100%{left:54%;top:50%;transform:scale(.8) rotate(0)}}
}
</style>
</head>
<body>
<div id="scene">
<div class="stars" id="stars"></div>
<div class="intro" id="intro">✨ A little birthday surprise for you ✨</div>

<div class="heart-area" id="heartArea">
<div class="heart"></div>
<div class="shine"></div>
</div>

<button class="arrow-button" id="arrowButton" aria-label="Shoot arrow">
<div class="arrow"></div>
<div class="click-text">✨ Click the arrow ✨</div>
</button>

<div class="impact" id="impact"></div>

<div class="message" id="message">
<h1>Happy Birthday</h1>
<span class="name">Ranjeet ❤️</span>
<div class="subtitle">May your day be filled with love & happiness ✨</div>
</div>

<button class="replay" id="replay">↻ Replay Surprise</button>
</div>

<script>
const scene=document.getElementById("scene");
const arrowButton=document.getElementById("arrowButton");
const heartArea=document.getElementById("heartArea");
const impact=document.getElementById("impact");
const message=document.getElementById("message");
const intro=document.getElementById("intro");
const replay=document.getElementById("replay");
let started=false;

function createStars(){
const c=document.getElementById("stars"); c.innerHTML="";
for(let i=0;i<90;i++){
const s=document.createElement("div"); s.className="star";
s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
s.style.animationDelay=Math.random()*3+"s";
s.style.animationDuration=(1.5+Math.random()*3)+"s"; c.appendChild(s);
}}

function createParticles(){
const colors=["#ff238f","#ff67b7","#ffd1eb","#fff","#ffd700","#b78cff"];
for(let i=0;i<100;i++){
const p=document.createElement("div"); p.className="particle";
const a=Math.random()*Math.PI*2, d=80+Math.random()*330;
p.style.setProperty("--x",Math.cos(a)*d+"px");
p.style.setProperty("--y",Math.sin(a)*d+"px");
p.style.background=colors[Math.floor(Math.random()*colors.length)];
p.style.width=(3+Math.random()*7)+"px"; p.style.height=(3+Math.random()*7)+"px";
scene.appendChild(p); requestAnimationFrame(()=>p.classList.add("explode"));
setTimeout(()=>p.remove(),2200);
}}

function createFirework(x,y){
const colors=["#ff238f","#ffd700","#fff","#7ee8ff","#ff8bd0"];
for(let i=0;i<28;i++){
const d=document.createElement("div"); d.className="firework";
d.style.left=x+"%"; d.style.top=y+"%";
const a=Math.random()*Math.PI*2, r=40+Math.random()*90;
d.style.setProperty("--fx",Math.cos(a)*r+"px");
d.style.setProperty("--fy",Math.sin(a)*r+"px");
d.style.background=colors[Math.floor(Math.random()*colors.length)];
scene.appendChild(d); requestAnimationFrame(()=>d.classList.add("go"));
setTimeout(()=>d.remove(),1200);
}}

function createFloatingHearts(){
for(let i=0;i<28;i++){
const h=document.createElement("div"); h.className="float-heart";
h.innerHTML=Math.random()>.5?"❤️":"♡";
h.style.left=Math.random()*100+"%";
h.style.fontSize=(14+Math.random()*28)+"px";
h.style.setProperty("--duration",(5+Math.random()*6)+"s");
h.style.animationDelay=Math.random()*5+"s";
scene.appendChild(h); setTimeout(()=>h.classList.add("go"),100);
setTimeout(()=>h.remove(),13000);
}}

function createConfetti(){
const colors=["#ff238f","#ffd700","#fff","#7ee8ff","#a88bff","#ff8bd0"];
for(let i=0;i<90;i++){
const c=document.createElement("div"); c.className="confetti";
c.style.left=Math.random()*100+"%";
c.style.background=colors[Math.floor(Math.random()*colors.length)];
c.style.width=(4+Math.random()*6)+"px"; c.style.height=(7+Math.random()*12)+"px";
c.style.setProperty("--duration",(4+Math.random()*5)+"s");
c.style.animationDelay=Math.random()*2+"s";
scene.appendChild(c); setTimeout(()=>c.classList.add("go"),100);
setTimeout(()=>c.remove(),10000);
}}

function shootArrow(){
if(started)return; started=true;
arrowButton.classList.add("flying"); intro.classList.add("hide");
setTimeout(()=>{heartArea.classList.add("hit");impact.classList.add("show");createParticles()},1400);
setTimeout(()=>{
message.classList.add("show"); createConfetti(); createFloatingHearts();
createFirework(20,28);
setTimeout(()=>createFirework(80,25),500);
setTimeout(()=>createFirework(50,35),1000);
setTimeout(()=>createFirework(12,60),1500);
setTimeout(()=>createFirework(88,60),1900);
replay.classList.add("show");
},2500);
}

function resetAnimation(){
started=false;
arrowButton.classList.remove("flying"); heartArea.classList.remove("hit");
impact.classList.remove("show"); message.classList.remove("show");
replay.classList.remove("show"); intro.classList.remove("hide");
void arrowButton.offsetWidth; void heartArea.offsetWidth;
void impact.offsetWidth; void message.offsetWidth; createStars();
}

arrowButton.addEventListener("click",shootArrow);
replay.addEventListener("click",resetAnimation);
createStars();
</script>
</body>
</html>
