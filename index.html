<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090016">
<title>Happy Birthday Ranjeet ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090016;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{color:#fff}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:
 radial-gradient(circle at 50% 35%,rgba(255,63,154,.16),transparent 28%),
 radial-gradient(circle at 20% 80%,rgba(80,90,255,.14),transparent 32%),
 linear-gradient(145deg,#05000c,#12001f 48%,#05000d)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stars{z-index:1}
#fx{z-index:8}
.vignette{position:absolute;inset:0;z-index:20;pointer-events:none;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.48) 100%)}
.ui{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:22px}
.intro{text-align:center;max-width:720px;transition:1s ease;transform:translateY(0);opacity:1}
.intro.hide{opacity:0;transform:translateY(-30px);pointer-events:none}
.kicker{font-size:clamp(13px,2.5vw,18px);letter-spacing:.3em;text-transform:uppercase;opacity:.72;margin-bottom:14px}
.title{font-size:clamp(32px,8vw,72px);line-height:.98;margin:0;font-weight:800;letter-spacing:-.04em;text-shadow:0 0 35px rgba(255,82,172,.55)}
.title .pink{background:linear-gradient(90deg,#fff,#ff9ed3,#ffd2eb);-webkit-background-clip:text;background-clip:text;color:transparent}
.hint{margin-top:18px;font-size:14px;opacity:.65}
.envelope-wrap{position:relative;width:min(82vw,420px);height:min(64vw,300px);perspective:1200px;cursor:pointer;filter:drop-shadow(0 25px 35px rgba(0,0,0,.4));transition:.8s cubic-bezier(.2,.8,.2,1)}
.envelope-wrap:hover{transform:translateY(-8px) scale(1.015)}
.envelope{position:absolute;inset:0;transform-style:preserve-3d}
.env-back{position:absolute;inset:0;border-radius:18px;background:linear-gradient(135deg,#65145c,#b72b77);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);overflow:hidden}
.env-back:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 35%,rgba(0,0,0,.16))}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(145deg,#8b1c68,#d84b91);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;z-index:4;transition:1s cubic-bezier(.2,.8,.2,1);backface-visibility:hidden}
.pocket{position:absolute;left:0;right:0;bottom:0;height:68%;background:linear-gradient(145deg,#78175f,#b62b76);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);z-index:5}
.seal{position:absolute;z-index:7;left:50%;top:54%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffb2d7,#ef2d84 58%,#8d0f59);box-shadow:0 0 0 5px rgba(255,255,255,.09),0 0 35px rgba(255,52,157,.55);font-size:27px;transition:.7s}
.letter{position:absolute;z-index:3;left:8%;right:8%;top:10%;height:82%;border-radius:12px;background:linear-gradient(150deg,#fff,#ffeef8);color:#7a1557;padding:25px 22px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.2);transform:translateY(42%);transition:1s cubic-bezier(.2,.8,.2,1)}
.letter b{display:block;font-size:clamp(22px,5vw,32px)}
.letter small{display:block;margin-top:8px;opacity:.7}
.open .flap{transform:rotateX(180deg)}
.open .letter{transform:translateY(-5%)}
.open .seal{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
.open .envelope-wrap{transform:scale(.96)}
.cta{position:absolute;bottom:7vh;left:50%;transform:translateX(-50%);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;border-radius:999px;padding:12px 18px;backdrop-filter:blur(12px);font-weight:600;letter-spacing:.02em;transition:.4s;z-index:12}
.open .cta{opacity:0;pointer-events:none;transform:translate(-50%,10px)}
#celebrate{position:absolute;inset:0;z-index:11;display:none;place-items:center;pointer-events:none}
#celebrate.show{display:grid}
.content{text-align:center;padding:20px;width:min(94vw,850px);animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(45px) scale(.92)}to{opacity:1;transform:none}}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.07);backdrop-filter:blur(12px);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.big-heart{width:90px;height:90px;margin:18px auto 14px;position:relative;transform:rotate(-45deg);filter:drop-shadow(0 0 30px rgba(255,45,143,.7));animation:heartbeat 1.35s ease-in-out infinite}
.big-heart:before,.big-heart:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#ff4aa2,#ff126d)}
.big-heart:before{top:-45px;left:0}.big-heart:after{top:0;left:45px}.big-heart{background:linear-gradient(135deg,#ff4aa2,#ff126d)}
@keyframes heartbeat{0%,100%{transform:rotate(-45deg) scale(1)}15%{transform:rotate(-45deg) scale(1.13)}30%{transform:rotate(-45deg) scale(1)}45%{transform:rotate(-45deg) scale(1.08)}60%{transform:rotate(-45deg) scale(1)}}
h1{font-size:clamp(38px,10vw,92px);line-height:.92;margin:0;letter-spacing:-.055em}
.name{display:block;margin-top:12px;font-size:clamp(42px,11vw,105px);font-weight:900;letter-spacing:-.06em;background:linear-gradient(90deg,#fff,#ff9ed1,#ffd4ea,#fff);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:300%}}
.sub{margin:20px auto 0;max-width:620px;font-size:clamp(15px,3.5vw,22px);line-height:1.55;color:rgba(255,255,255,.8)}
.typing{min-height:1.5em}
.cursor{display:inline-block;width:2px;height:1em;background:#fff;margin-left:4px;vertical-align:-.12em;animation:blink .7s infinite}
@keyframes blink{50%{opacity:0}}
.actions{margin-top:25px;display:flex;justify-content:center;gap:10px;pointer-events:auto}
button{font:inherit}
.replay,.sound{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:10px 15px;backdrop-filter:blur(10px);cursor:pointer}
.sound{width:42px;height:42px;padding:0}
.tiny{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.45;z-index:30;white-space:nowrap}
.flash{position:absolute;inset:0;background:#fff;z-index:25;opacity:0;pointer-events:none}
.flash.go{animation:flash .65s ease-out}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
@media(max-width:600px){.envelope-wrap{height:230px}.letter{padding:18px 12px}.seal{width:56px;height:56px}.tiny{display:none}}
</style>
</head>
<body>
<div id="app">
<canvas id="stars"></canvas>
<canvas id="fx"></canvas>
<div class="vignette"></div>
<div class="flash" id="flash"></div>

<div class="ui" id="introScreen">
  <div class="intro" id="intro">
    <div class="kicker">A tiny surprise for someone special</div>
    <h2 class="title">Open your <span class="pink">birthday</span> surprise ✨</h2>
    <div class="hint">Tap the envelope</div>
    <div class="envelope-wrap" id="envelopeWrap" role="button" tabindex="0" aria-label="Open birthday envelope">
      <div class="envelope" id="envelope">
        <div class="env-back"></div>
        <div class="letter"><b>For Ranjeet ❤️</b><small>There is something waiting inside...</small></div>
        <div class="flap"></div>
        <div class="pocket"></div>
        <div class="seal">♥</div>
      </div>
    </div>
    <button class="cta" id="cta">Tap to open ✨</button>
  </div>
</div>

<div id="celebrate">
  <div class="content">
    <div class="badge">✨ Today is your day ✨</div>
    <div class="big-heart"></div>
    <h1>Happy Birthday</h1>
    <span class="name">Ranjeet ❤️</span>
    <div class="sub"><span id="typing"></span><span class="cursor"></span></div>
    <div class="actions">
      <button class="sound" id="sound" aria-label="Toggle sound">🔊</button>
      <button class="replay" id="replay">↻ Replay</button>
    </div>
  </div>
</div>
<div class="tiny">Made with ✨ for Ranjeet</div>
</div>

<script>
const stars=document.getElementById('stars'), fx=document.getElementById('fx');
const sctx=stars.getContext('2d'), fctx=fx.getContext('2d');
let W,H,dpr,starList=[],particles=[],rockets=[],confetti=[],hearts=[],opened=false,soundOn=true,raf;

function resize(){
 dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
 [stars,fx].forEach(c=>{c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px'});
 sctx.setTransform(dpr,0,0,dpr,0,0); fctx.setTransform(dpr,0,0,dpr,0,0);
 starList=Array.from({length:Math.min(150,Math.floor(W*H/7000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.2,a:Math.random(),v:Math.random()*.018+.004}));
}
addEventListener('resize',resize); resize();

function starsLoop(){
 sctx.clearRect(0,0,W,H);
 for(const s of starList){s.a+=s.v;let a=.2+.55*(.5+.5*Math.sin(s.a*8));sctx.globalAlpha=a;sctx.fillStyle='#fff';sctx.beginPath();sctx.arc(s.x,s.y,s.r,0,Math.PI*2);sctx.fill()}
 sctx.globalAlpha=1; requestAnimationFrame(starsLoop)
}
starsLoop();

function burst(x,y,n=80,power=5){
 for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,sp=Math.random()*power+.8;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:.012+Math.random()*.018,size:Math.random()*3+1,hue:Math.random()*50+320})}
}
function firework(x,y){
 let sy=H+10,tx=x,ty=y;rockets.push({x:W*x/100,y:sy,tx:W*x/100,ty:H*y/100,done:false});
}
function spawnConfetti(){
 for(let i=0;i<130;i++)confetti.push({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*2,vy:2+Math.random()*4,r:Math.random()*6+3,rot:Math.random()*6,vr:(Math.random()-.5)*.2,h:Math.random()*360});
}
function floatHearts(){
 for(let i=0;i<18;i++)hearts.push({x:Math.random()*W,y:H+30,vy:.5+Math.random()*1.3,size:10+Math.random()*22,a:.8,drift:Math.random()*Math.PI*2});
}
function drawFX(){
 fctx.clearRect(0,0,W,H);
 // rockets
 for(let i=rockets.length-1;i>=0;i--){let r=rockets[i],dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy),step=8;
  r.x+=dx/d*step;r.y+=dy/d*step;fctx.fillStyle='rgba(255,255,255,.9)';fctx.beginPath();fctx.arc(r.x,r.y,2,0,7);fctx.fill();
  if(d<12){burst(r.tx,r.ty,75,5);rockets.splice(i,1)}
 }
 // particles
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.992;p.life-=p.dec;
  if(p.life<=0){particles.splice(i,1);continue}
  fctx.globalAlpha=p.life;fctx.fillStyle=`hsl(${p.hue},100%,${65+p.life*25}%)`;fctx.beginPath();fctx.arc(p.x,p.y,p.size*p.life,0,7);fctx.fill()
 }
 // confetti
 for(let i=confetti.length-1;i>=0;i--){let c=confetti[i];c.x+=c.vx;c.y+=c.vy;c.vy+=.025;c.rot+=c.vr;
  fctx.save();fctx.translate(c.x,c.y);fctx.rotate(c.rot);fctx.globalAlpha=.85;fctx.fillStyle=`hsl(${c.h},90%,70%)`;fctx.fillRect(-c.r/2,-c.r/4,c.r,c.r/2);fctx.restore();
  if(c.y>H+30)confetti.splice(i,1)
 }
 // hearts
 for(let i=hearts.length-1;i>=0;i--){let h=hearts[i];h.y-=h.vy;h.x+=Math.sin(h.y*.012+h.drift)*.45;h.a-=.002;
  if(h.a<=0){hearts.splice(i,1);continue}
  fctx.globalAlpha=h.a;fctx.font=`${h.size}px serif`;fctx.fillStyle='#ff6db5';fctx.fillText('♥',h.x,h.y)
 }
 fctx.globalAlpha=1;raf=requestAnimationFrame(drawFX)
}
drawFX();

function chime(){
 if(!soundOn)return;
 try{const A=new AudioContext(),o=A.createOscillator(),g=A.createGain();o.type='sine';o.frequency.setValueAtTime(660,A.currentTime);o.frequency.exponentialRampToValueAtTime(990,A.currentTime+.28);g.gain.setValueAtTime(.0001,A.currentTime);g.gain.exponentialRampToValueAtTime(.16,A.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+.5);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+.52)}catch(e){}
}
function typeText(){
 const el=document.getElementById('typing'),text="May this new year of your life bring you beautiful memories, big smiles, endless happiness and all the love you deserve. Keep shining! ✨";
 el.textContent='';let i=0;
 const t=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(t)},32);
}
function celebrate(){
 document.getElementById('introScreen').style.display='none';
 document.getElementById('celebrate').classList.add('show');
 document.getElementById('flash').classList.add('go');
 burst(W/2,H*.48,150,8);spawnConfetti();floatHearts();
 [ [50,23],[18,34],[82,30],[28,58],[72,55],[50,72] ].forEach((p,i)=>setTimeout(()=>firework(p[0],p[1]),i*420));
 typeText(); chime();
}
function open(){
 if(opened)return; opened=true;
 document.getElementById('envelope').classList.add('open');
 document.getElementById('intro').classList.add('hide');
 chime();
 setTimeout(celebrate,1500);
}
document.getElementById('envelopeWrap').addEventListener('click',open);
document.getElementById('cta').addEventListener('click',open);
document.getElementById('envelopeWrap').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')open()});
document.getElementById('replay').addEventListener('click',()=>location.reload());
document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇'});

// ambient fireflies
setInterval(()=>{if(opened && Math.random()<.7)burst(Math.random()*W,H*(.15+.65*Math.random()),4,1.2)},450);
</script>
</body>
</html>
